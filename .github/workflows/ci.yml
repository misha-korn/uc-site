name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Проверки Django и тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uc_site
          POSTGRES_USER: uc_user
          POSTGRES_PASSWORD: uc_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uc_user -d uc_site"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-not-secret-${{ github.run_id }}-long-enough-for-checks-0123456789abcdef
      DEBUG: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CSRF_TRUSTED_ORIGINS: https://localhost
      SITE_URL: https://localhost
      SITE_DEMO: "1"
      DATABASE_URL: postgres://uc_user:uc_pass@localhost:5432/uc_site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Шрифты для демо-PDF
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: manage.py check
        run: python manage.py check

      - name: Нет несозданных миграций
        run: python manage.py makemigrations --check --dry-run

      - name: Миграции применяются
        run: python manage.py migrate --noinput

      - name: collectstatic
        run: python manage.py collectstatic --noinput

      - name: Тесты
        run: python manage.py test --noinput -v 2

      - name: Демо-данные загружаются
        run: python manage.py seed_demo --reset

      - name: Тесты экспорта статической копии
        run: python -m unittest scripts/test_export_static.py -v

      - name: Статическая демо-копия (проверка битых ссылок)
        run: python scripts/export_static.py --out dist --database-url "$DATABASE_URL"

      - name: Проверка боевых настроек (check --deploy)
        env:
          SECURE_SSL_REDIRECT: "1"
          SITE_DEMO: "0"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Сохранить демо-копию
        uses: actions/upload-artifact@v4
        with:
          name: static-demo
          path: dist
          retention-days: 7

  shell:
    name: Синтаксис скриптов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: for f in scripts/*.sh deploy/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh deploy/*.sh
      - name: Нет многострочных {# #} в шаблонах (Django их не считает комментарием)
        run: |
          if grep -rn "{#" templates | grep -v "#}"; then
            echo "Используйте {% comment %}...{% endcomment %} для многострочных комментариев"; exit 1
          fi

  docker:
    name: Сборка Docker-образа
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker compose config
        run: cp .env.example .env && docker compose config -q
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: uc-site:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Контейнер стартует и отвечает (healthcheck)
        run: |
          docker run -d --name uc -p 8000:8000 \
            -e SECRET_KEY=ci-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFG \
            -e DEBUG=0 -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DATABASE_URL=sqlite:////tmp/ci.sqlite3 uc-site:ci
          for i in $(seq 1 30); do
            st=$(docker inspect -f '{{.State.Health.Status}}' uc)
            echo "health: $st"; [ "$st" = healthy ] && break; sleep 3
          done
          docker logs uc
          curl -fsS -H 'Host: localhost' http://127.0.0.1:8000/robots.txt
          test "$(docker inspect -f '{{.State.Health.Status}}' uc)" = healthy
