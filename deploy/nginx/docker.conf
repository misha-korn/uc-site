# nginx для docker-compose: принимает HTTP на 80 порту контейнера.
# HTTPS в docker-варианте обычно делают внешним прокси (панель хостинга, Caddy, Traefik)
# или certbot на хосте. Если прокси передаёт X-Forwarded-Proto — он пробрасывается дальше.

# Защита входа в панель от перебора паролей: не более 5 попыток в минуту с одного IP
# (+ запас 5 попыток подряд). Сверх лимита nginx отвечает 429 Too Many Requests.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream django {
    server web:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    charset utf-8;
    client_max_body_size 20m;   # загрузка PDF-документов в панели

    # Если перед контейнером стоит nginx хоста (host-ssl-proxy.conf), реальный IP посетителя
    # приходит в X-Real-IP. Доверяем ему только для адресов docker-сетей и localhost —
    # подделать IP снаружи нельзя. Нужно для лимита входа в панель и лимита заявок.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    include /etc/nginx/snippets/gzip.conf;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
        # Загруженные файлы никогда не исполняются и не рендерятся как HTML
        location ~* \.(html?|svg|xml|js|php|py|sh)$ {
            add_header Content-Disposition "attachment" always;
            include /etc/nginx/snippets/security-headers.conf;
        }
    }

    # Проверка живости самого nginx (для healthcheck в docker-compose)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico {
        alias /app/staticfiles/img/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # Страница входа в панель — с ограничением частоты (зона login выше).
    location = /admin/login/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-django.conf;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://django;
    }

    location / {
        include /etc/nginx/snippets/proxy-django.conf;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://django;
    }
}
