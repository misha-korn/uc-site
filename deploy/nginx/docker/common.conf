# Общие настройки уровня http (подключаются в обоих режимах).
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

upstream django {
    server web:8000;
    keepalive 16;
}

server_tokens off;
charset utf-8;
client_max_body_size 20m;   # загрузка PDF-документов в панели
include /etc/nginx/snippets/gzip.conf;
