# Общие location для сайта (подключаются и в режиме HTTP, и в режиме HTTPS).

location /static/ {
    alias /app/staticfiles/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public";
    include /etc/nginx/snippets/security-headers.conf;
}

location /media/ {
    alias /app/media/;
    expires 7d;
    include /etc/nginx/snippets/security-headers.conf;
    # Загруженные файлы никогда не исполняются и не открываются как HTML
    location ~* \.(html?|svg|xml|js|php|py|sh)$ {
        add_header Content-Disposition "attachment" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}

location = /favicon.ico {
    alias /app/staticfiles/favicon.svg;
    default_type image/svg+xml;
    access_log off;
    log_not_found off;
}

# Вход в панель — не более 5 попыток в минуту с одного IP (+5 подряд), сверх — 429
location = /admin/login/ {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/proxy-django.conf;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://django;
}

location / {
    include /etc/nginx/snippets/proxy-django.conf;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://django;
}
