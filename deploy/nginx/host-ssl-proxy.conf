# nginx НА ХОСТЕ перед docker compose: HTTPS (certbot) → nginx контейнера на 127.0.0.1:8080.
# В .env проекта: HTTP_PORT=127.0.0.1:8080 (контейнер не торчит наружу).
# Установка (замените example.ru на свой домен):
#   sudo cp deploy/nginx/host-ssl-proxy.conf /etc/nginx/sites-available/uc-site.conf
#   sudo sed -i 's/example\.ru/ВАШ-ДОМЕН.ru/g' /etc/nginx/sites-available/uc-site.conf
# Сертификат выпускается ДО включения этого файла — см. DEPLOY.md, «Docker + HTTPS».

# HTTP → HTTPS и проверки Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name indiga.ru www.indiga.ru;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://indiga.ru$request_uri;
    }
}

# www → без www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.indiga.ru;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/indiga.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indiga.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://indiga.ru$request_uri;
}

# Основной сайт
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name indiga.ru;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/indiga.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indiga.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 20m;   # загрузка PDF в панели

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
