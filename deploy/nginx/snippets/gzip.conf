gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml application/rss+xml
    application/xhtml+xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;
