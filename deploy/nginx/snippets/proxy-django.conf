# Проксирование запросов в Django (uvicorn). X-Forwarded-Proto задаётся в каждом конфиге отдельно;
# Django узнаёт реальный протокол
# из X-Forwarded-Proto (SECURE_PROXY_SSL_HEADER) и IP посетителя из X-Real-IP / X-Forwarded-For.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# nginx — первая точка входа, поэтому X-Forwarded-For ПЕРЕЗАПИСЫВАЕМ реальным IP
# (иначе посетитель подделает IP и обойдёт лимит заявок). Если перед nginx есть ещё
# прокси (CDN, панель хостинга) — замените на $proxy_add_x_forwarded_for и настройте real_ip.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Host  $host;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_redirect off;
proxy_connect_timeout 10s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
# Эти заголовки ставит nginx — убираем дубли от Django
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
