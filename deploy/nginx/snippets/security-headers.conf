# Заголовки безопасности (подключаются через include в каждом location,
# т.к. add_header внутри location отменяет заголовки уровня server).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Content-Security-Policy и Permissions-Policy ставит сам Django (core/middleware.py, настройки —
# CSP_DIRECTIVES / PERMISSIONS_POLICY в config/settings.py). Здесь их НЕ дублируем: два разных
# заголовка CSP браузер применяет оба сразу, и отладить такое очень трудно.
