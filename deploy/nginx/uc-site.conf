# nginx для VPS (Ubuntu) без Docker. Скопировать в /etc/nginx/sites-available/uc-site.conf,
# заменить example.ru на свой домен и /srv/uc-site на путь к проекту. Подробно — DEPLOY.md.
# Сниппеты: sudo cp -r deploy/nginx/snippets /etc/nginx/snippets/uc-site
# SSL-сертификат выпускается командой: sudo certbot --nginx -d example.ru -d www.example.ru

# Защита входа в панель от перебора паролей: не более 5 попыток в минуту с одного IP
# (+ запас 5 попыток подряд). Сверх лимита nginx отвечает 429 Too Many Requests.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

upstream uc_site_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP -> HTTPS (и выдача проверок Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name example.ru www.example.ru;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://example.ru$request_uri;
    }
}

# www -> без www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.ru;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;
    return 301 https://example.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.ru;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    charset utf-8;
    client_max_body_size 20m;   # загрузка PDF-документов в панели

    access_log /var/log/nginx/uc-site.access.log;
    error_log  /var/log/nginx/uc-site.error.log warn;

    include /etc/nginx/snippets/uc-site/gzip.conf;

    location /static/ {
        alias /srv/uc-site/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        include /etc/nginx/snippets/uc-site/security-headers.conf;
    }

    location /media/ {
        alias /srv/uc-site/media/;
        expires 7d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        include /etc/nginx/snippets/uc-site/security-headers.conf;
        location ~* \.(html?|svg|xml|js|php|py|sh)$ {
            add_header Content-Disposition "attachment" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            include /etc/nginx/snippets/uc-site/security-headers.conf;
        }
    }

    location = /favicon.ico {
        alias /srv/uc-site/staticfiles/img/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # Страница входа в панель — с ограничением частоты (зона login выше).
    location = /admin/login/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/uc-site/proxy-django.conf;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        include /etc/nginx/snippets/uc-site/security-headers.conf;
        proxy_pass http://uc_site_app;
    }

    location / {
        include /etc/nginx/snippets/uc-site/proxy-django.conf;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        include /etc/nginx/snippets/uc-site/security-headers.conf;
        proxy_pass http://uc_site_app;
    }
}
