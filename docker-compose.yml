# =====================================================================
#  Полный стек: PostgreSQL + сайт (uvicorn) + nginx.
#  1) cp .env.example .env  и заполнить (SECRET_KEY, DEBUG=0, ALLOWED_HOSTS, POSTGRES_PASSWORD...)
#  2) docker compose up -d --build
#  3) docker compose exec web python manage.py createsuperuser
#  HTTPS: sudo certbot certonly --webroot -w /var/www/html -d ДОМЕН -d www.ДОМЕН
#  (nginx сам переключится на https в течение минуты — см. DEPLOY.md «Docker + HTTPS»)
# =====================================================================
name: uc-site

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uc_site}
      POSTGRES_USER: ${POSTGRES_USER:-uc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      TZ: Europe/Samara
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  web:
    build: .
    image: uc-site:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "0"   # на сервере всегда 0, даже если в .env забыли поменять
      DATABASE_URL: postgres://${POSTGRES_USER:-uc_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-uc_site}
      PORT: "8000"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      USE_X_FORWARDED_FOR: "1"   # за nginx — реальный IP посетителя для лимита заявок
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    expose:
      - "8000"
    networks: [backend, frontend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Задайте SITE_DOMAIN в .env, например indiga.ru}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Конфиг выбирается автоматически: без сертификата — HTTP, с сертификатом — HTTPS
      - ./deploy/nginx/docker/40-uc-site.sh:/docker-entrypoint.d/40-uc-site.sh:ro
      - ./deploy/nginx/docker:/etc/nginx/uc-site:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      # Сертификаты и папка проверки certbot — с хоста (certbot ставится на хост)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/html:/var/www/html:ro
      - static:/app/staticfiles:ro
      - media:/app/media:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [frontend]

volumes:
  pgdata:
  static:
  media:

networks:
  backend:
  frontend:
